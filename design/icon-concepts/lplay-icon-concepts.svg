<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Lplay icon concept board</title>
  <desc id="desc">Six SVG icon concepts for the Lplay desktop app.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1600" y2="1120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171614"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:700 52px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f2e8d8}
      .subtitle{font:400 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9f9486}
      .label{font:700 32px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f2e8d8}
      .note{font:400 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9f9486}
      .tile{fill:#131210;stroke:#2f2a25;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#pageBg)"/>
  <text x="90" y="92" class="title">Lplay App Icon Concepts</text>
  <text x="92" y="132" class="subtitle">Pick A-F. Each option is vector-ready for PNG/ICO export.</text>

  <g transform="translate(90 184)">
    <rect class="tile" width="420" height="398" rx="26" filter="url(#cardShadow)"/>
    <image href="lplay-icon-a-split-play.svg" x="58" y="34" width="304" height="304"/>
    <text x="42" y="352" class="label">A. Split Play</text>
    <text x="42" y="378" class="note">Best for multi-screen playback</text>
  </g>
  <g transform="translate(590 184)">
    <rect class="tile" width="420" height="398" rx="26" filter="url(#cardShadow)"/>
    <image href="lplay-icon-b-l-mark.svg" x="58" y="34" width="304" height="304"/>
    <text x="42" y="352" class="label">B. L Mark</text>
    <text x="42" y="378" class="note">Strongest brand letter shape</text>
  </g>
  <g transform="translate(1090 184)">
    <rect class="tile" width="420" height="398" rx="26" filter="url(#cardShadow)"/>
    <image href="lplay-icon-c-highlight.svg" x="58" y="34" width="304" height="304"/>
    <text x="42" y="352" class="label">C. Highlight</text>
    <text x="42" y="378" class="note">Emphasizes bookmarks and notes</text>
  </g>

  <g transform="translate(90 646)">
    <rect class="tile" width="420" height="398" rx="26" filter="url(#cardShadow)"/>
    <image href="lplay-icon-d-stream-download.svg" x="58" y="34" width="304" height="304"/>
    <text x="42" y="352" class="label">D. Stream</text>
    <text x="42" y="378" class="note">Good for M3U8 and downloads</text>
  </g>
  <g transform="translate(590 646)">
    <rect class="tile" width="420" height="398" rx="26" filter="url(#cardShadow)"/>
    <image href="lplay-icon-e-layered-cards.svg" x="58" y="34" width="304" height="304"/>
    <text x="42" y="352" class="label">E. Layers</text>
    <text x="42" y="378" class="note">Polished video-card identity</text>
  </g>
  <g transform="translate(1090 646)">
    <rect class="tile" width="420" height="398" rx="26" filter="url(#cardShadow)"/>
    <image href="lplay-icon-f-minimal-badge.svg" x="58" y="34" width="304" height="304"/>
    <text x="42" y="352" class="label">F. Minimal</text>
    <text x="42" y="378" class="note">Cleanest at small sizes</text>
  </g>
</svg>
