    <rect x="18" y="276" width="96" height="38" rx="7" fill="#1d6f68" stroke="#2e8e84"/>
    <text x="48" y="300" fill="#fff" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Start</text>
    <rect x="124" y="276" width="42" height="38" rx="7" fill="#24211d" stroke="#4a443c"/>
    <path d="M137 286 l16 16 M153 286 l-16 16" stroke="#d5cbbb" stroke-width="2"/>
