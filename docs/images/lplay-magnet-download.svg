    <text x="34" y="372" fill="#f4eee5" font-family="Segoe UI, Arial" font-size="15" font-weight="700">sample-video-pack</text>
    <rect x="292" y="352" width="56" height="24" rx="12" fill="#25221d"/>
    <text x="304" y="369" fill="#f1c46d" font-family="Segoe UI, Arial" font-size="11">72%</text>
    <rect x="34" y="394" width="314" height="8" rx="4" fill="#0c0b0a"/>
