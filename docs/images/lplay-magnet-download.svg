    <text x="146" y="58" fill="#f4eee5" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Download files</text>
    <text x="146" y="86" fill="#bfb5a7" font-family="Segoe UI, Arial" font-size="14">Paste a magnet link in the sidebar</text>
  </g>
  <rect x="838" y="76" width="422" height="660" rx="8" fill="#151412" stroke="#39342d"/>
