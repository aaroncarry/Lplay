    <path d="M140 463 h16 l3 9 h-22 z M140 458 h8 l3 5" fill="none" stroke="#d5cbbb" stroke-width="1.8"/>
    <rect x="174" y="446" width="32" height="32" rx="7" fill="#24211d" stroke="#4a443c"/>
    <path d="M184 456 h12 M187 456 v15 M193 456 v15 M182 460 h16" stroke="#ffb0a6" stroke-width="1.8"/>
    <rect x="18" y="536" width="346" height="58" rx="8" fill="#151412" stroke="#a8483b"/>
    <text x="34" y="566" fill="#f4eee5" font-family="Segoe UI, Arial" font-size="14" font-weight="700">cancelled-task</text>
    <text x="258" y="566" fill="#ffb0a6" font-family="Segoe UI, Arial" font-size="12">Retry or delete</text>
