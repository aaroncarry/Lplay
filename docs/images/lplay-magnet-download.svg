<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Lplay magnet download panel</title>
  <desc id="desc">The right sidebar magnet download panel with default folder, progress, retry, and delete actions.</desc>
  <rect width="1280" height="760" fill="#11100f"/>
  <rect x="0" y="0" width="1280" height="58" fill="#161411"/>
  <text x="76" y="36" fill="#f4eee5" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Lplay</text>
  <text x="76" y="52" fill="#bfb5a7" font-family="Segoe UI, Arial" font-size="12">Magnet workflow</text>
  <rect x="20" y="76" width="795" height="660" rx="8" fill="#151412" stroke="#39342d"/>
  <g transform="translate(210 230)">
